<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>To-Do</title>
</head>
<body>
    <section class="container">
        <header>To-Do</header>
        <main>
            <div class="input-task">
                <input class="input" id="input-new-task" maxlength="256" placeholder="Input task">
                <button class="button" id="button-add-new-task">Add task</button>
            </div>
            <div class="control-elements">
                <div class="checkbox-with-label">
                    <input class="checkbox" id="button-select-all-tasks" type="checkbox" disabled>
                    <label for="button-select-all-tasks">Select all tasks</label>
                </div>
                <button class="button" id="button-delete-completed-tasks" disabled>Delete completed tasks</button>
            </div>
            <div class="tabs-and-list-tasks">
                <nav class="tabs">
                    <button class="button tab"id="button-all-tasks" disabled>All (0)</button>
                    <button class="button tab" id="button-active-tasks" disabled>Active (0)</button>
                    <button class="button tab" id="button-completed-tasks" disabled>Completed (0)</button>
                </nav>
                <ul class="list-tasks"></ul>
            </div>
            <div class="pagination-bar"></div>
        </main>
    </section>
    <script src="./script.js"></script>
</body>
</html>
